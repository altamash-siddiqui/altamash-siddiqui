<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="820"
     viewBox="0 0 1200 820">

<!-- Background -->
<rect width="1200" height="820" rx="18" fill="#0d1117"/>

<!-- Terminal -->
<rect x="20"
      y="20"
      width="1160"
      height="780"
      rx="12"
      fill="#161b22"
      stroke="#30363d"/>

<!-- Header -->
<rect x="20"
      y="20"
      width="1160"
      height="42"
      rx="12"
      fill="#21262d"/>

<!-- Buttons -->
<circle cx="45" cy="41" r="6" fill="#ff5f56"/>
<circle cx="65" cy="41" r="6" fill="#ffbd2e"/>
<circle cx="85" cy="41" r="6" fill="#27c93f"/>

<text x="550"
      y="46"
      fill="#8b949e"
      font-family="monospace"
      font-size="16">
terminal.svg
</text>

<style>

.ascii{
font-family:monospace;
font-size:7px;
fill:#c9d1d9;
white-space:pre;
opacity:0;
animation:show .15s forwards;
}

.info{
font-family:monospace;
font-size:20px;
fill:#c9d1d9;
}

.title{
font-family:monospace;
font-size:24px;
font-weight:bold;
fill:white;
}

.blue{
fill:#58a6ff;
}

.green{
fill:#3fb950;
}

.gray{
fill:#8b949e;
}

.cursor{
animation:blink 1s steps(1) infinite;
}

@keyframes show{
to{
opacity:1;
}
}

@keyframes blink{
50%{
opacity:0;
}
}

</style>

<!-- LEFT -->

<g id="ascii-panel">

<rect
x="35"
y="110"
width="700"
height="650"
rx="10"
fill="#0d1117"
stroke="#30363d"/>

<text
x="50"
y="135"
class="ascii"
style="animation-delay:0s">

Loading ASCII...

</text>

</g>

<!-- RIGHT -->

<g id="info-panel">

<rect
x="785"
y="110"
width="365"
height="630"
rx="10"
fill="#0d1117"
stroke="#30363d"/>

<text
x="810"
y="145"
class="title">
SYSTEM INFO
</text>

<text
x="810"
y="185"
class="info">
Name : Altamash Siddiqui
</text>

<text
x="810"
y="220"
class="info">
Role : AI Developer
</text>

<text
x="810"
y="270"
class="info">
Python : ██████████
</text>

<text
x="810"
y="305"
class="info">
AI     : ███████████
</text>

<text
x="810"
y="340"
class="info">
AWS    : ███████
</text>

<text
x="810"
y="375"
class="info">
Git    : █████████
</text>

<text
x="810"
y="430"
class="green">
ASCII : TYPING...
</text>

<rect
class="cursor"
x="975"
y="414"
width="8"
height="18"
fill="#3fb950"/>

<text
x="810"
y="475"
class="blue">
Status : ONLINE ●
</text>

</g>

<!-- Divider -->

<line
x1="760"
y1="70"
x2="760"
y2="780"
stroke="#30363d"
stroke-width="2"/>

<!-- Left Title -->

<text
x="40"
y="90"
class="title">

ASCII TERMINAL

</text>

</svg>
