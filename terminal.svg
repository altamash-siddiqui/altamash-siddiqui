<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="820"
     viewBox="0 0 1200 820">

<!-- Background -->
<rect width="1200" height="820" rx="18" fill="#0d1117"/>

<!-- Terminal -->
<rect x="20"
      y="20"
      width="1160"
      height="780"
      rx="12"
      fill="#161b22"
      stroke="#30363d"/>

<!-- Header -->
<rect x="20"
      y="20"
      width="1160"
      height="42"
      rx="12"
      fill="#21262d"/>

<!-- Buttons -->
<circle cx="45" cy="41" r="6" fill="#ff5f56" stroke="#ffffff22"/>
<circle cx="65" cy="41" r="6" fill="#ffbd2e" stroke="#ffffff22"/>
<circle cx="85" cy="41" r="6" fill="#27c93f" stroke="#ffffff22"/>

<text x="550"
      y="46"
      fill="#8b949e"
      font-family="monospace"
      font-size="16">
Altamash Terminal v2.0
</text>

<style>

.ascii{
font-family:monospace;
font-size:7px;
fill:#c9d1d9;
white-space:pre;
opacity:0;
animation:show .15s forwards;
}

.info{
font-family:monospace;
font-size:20px;
fill:#c9d1d9;
}

.title{
font-family:monospace;
font-size:24px;
font-weight:bold;
fill:white;
}

.blue{
fill:#58a6ff;
}

.green{
fill:#3fb950;
}

.gray{
fill:#8b949e;
}

.cursor{
animation:blink 1s steps(1) infinite;
}

@keyframes show{
to{
opacity:1;
}
}

@keyframes blink{
50%{
opacity:0;
}
}

</style>

<!-- LEFT -->

